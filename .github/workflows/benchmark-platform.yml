name: Compare macOS packaging runners
on:
  push:
    branches: [bb/benchmark-platform-critical-20261025]
permissions:
  contents: read
jobs:
  ready:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - run: date -u
  benchmark:
    needs: ready
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-6vcpu-macos-15, macos-15]
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler
      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: 22.x
          cache-prefix: package-smoke
          turbo-cache-max-size-mb: '256'
      - name: Restore pnpm cache
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm
      - name: Install dependencies
        timeout-minutes: 5
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --filter '!@bb/mobile'
      - name: Smoke bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --output-logs=new-only --summarize --concurrency=4 > "$RUNNER_TEMP/packaging.log" 2>&1
      - name: Bound saved Turbo cache
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 256 --keep-run-summaries .turbo/runs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mac-runner-${{ matrix.runner }}-${{ matrix.replica }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/packaging.log
            .turbo/runs/*.json
