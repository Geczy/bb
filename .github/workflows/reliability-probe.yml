name: Diagnose runtime shutdown
on:
  push:
    branches: [bb/ci-reliability-probe-20261024]
permissions:
  contents: read
jobs:
  probe:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
        continue-on-error: true
      - run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Repeat stalled replacement shutdown
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          VITEST_MAX_WORKERS: 2
        run: |
          for iteration in {1..30}; do
            echo "REPETITION $iteration"
            pnpm exec turbo run test --filter=@bb/agent-runtime --force -- src/runtime.process-lifecycle.test.ts -t 'does not wait for stalled replacement initialization during full shutdown' || exit 1
          done
