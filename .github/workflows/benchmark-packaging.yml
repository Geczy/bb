name: Measure Linux packaging critical path
on:
  push:
    branches: [bb/benchmark-critical-path-20261024]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore baseline smoke
        if: matrix.variant == 'baseline'
        run: |
          git fetch --depth=1 origin 06bb048a522432f6383b13ba90213582807d8d7a
          git show FETCH_HEAD:packages/bb-app/scripts/smoke-tarball.mjs > packages/bb-app/scripts/smoke-tarball.mjs
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
      - name: Install workspace
        run: bash .github/actions/setup-workspace/install-dependencies.sh
      - uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"
      - name: Sequential packaging baseline
        if: matrix.variant == 'baseline'
        run: |
          /usr/bin/time -f '{"seconds":%e,"exitCode":%x}' -o "$RUNNER_TEMP/packaging-time.json" bash -e -c '
            pnpm exec turbo run smoke:tarball --filter=bb-app --summarize --concurrency=4
            pnpm exec turbo run desktop:build:linux --filter=@bb/desktop --summarize
          ' > "$RUNNER_TEMP/packaging.log" 2>&1
      - name: Concurrent packaging candidate
        if: matrix.variant == 'candidate'
        run: /usr/bin/time -f '{"seconds":%e,"exitCode":%x}' -o "$RUNNER_TEMP/packaging-time.json" pnpm exec turbo run 'bb-app#smoke:tarball' '@bb/desktop#desktop:build:linux' --summarize --concurrency=4 --continue=dependencies-successful > "$RUNNER_TEMP/packaging.log" 2>&1
      - name: Check desktop package contains no injected stale chunks
        run: |
          if rg --files --hidden apps/desktop/release | rg 'SLOP-CACHE-STALE'; then
            exit 1
          fi
      - uses: ./.github/actions/install-appimage-fuse
        with:
          package: libfuse2t64
      - name: Smoke Linux AppImage lifecycle
        run: xvfb-run -a pnpm exec turbo run smoke:appimage-lifecycle --filter=@bb/desktop --force > "$RUNNER_TEMP/lifecycle.log" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: packaging-critical-${{ matrix.variant }}-${{ matrix.replica }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/packaging-time.json
            ${{ runner.temp }}/packaging.log
            ${{ runner.temp }}/lifecycle.log
            .turbo/runs/*.json
