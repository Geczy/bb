name: Paired Linux packaging critical path
on:
  push:
    branches: [bb/benchmark-critical-path-20261024]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
      - name: Install workspace
        run: bash .github/actions/setup-workspace/install-dependencies.sh
      - uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"
      - name: Prepare shared builds and Electron tool downloads
        run: |
          pnpm exec turbo run desktop:build:linux --filter=@bb/desktop --output-logs=errors-only > "$RUNNER_TEMP/prepare.log" 2>&1
          cp packages/bb-app/scripts/smoke-tarball.mjs "$RUNNER_TEMP/candidate.mjs"
          git fetch --depth=1 origin 06bb048a522432f6383b13ba90213582807d8d7a
          git show FETCH_HEAD:packages/bb-app/scripts/smoke-tarball.mjs > "$RUNNER_TEMP/baseline.mjs"
      - name: Compare both schedules on the same runner
        env:
          BENCHMARK_ORDER: ${{ matrix.order }}
        run: |
          variants="baseline candidate"
          if [[ "$BENCHMARK_ORDER" == "candidate-first" ]]; then
            variants="candidate baseline"
          fi
          for variant in $variants; do
            result_dir="$RUNNER_TEMP/results/$variant"
            mkdir -p "$result_dir"
            cp "$RUNNER_TEMP/$variant.mjs" packages/bb-app/scripts/smoke-tarball.mjs
            pnpm exec turbo run build --filter=@bb/desktop --output-logs=errors-only > "$result_dir/prepare.log" 2>&1
            rm -rf apps/desktop/release .turbo/runs
            export npm_config_cache="$RUNNER_TEMP/npm-$variant"
            if [[ "$variant" == "baseline" ]]; then
              /usr/bin/time -f '{"seconds":%e,"exitCode":%x}' -o "$result_dir/time.json" bash -e -c '
                pnpm exec turbo run smoke:tarball --filter=bb-app --only --summarize --concurrency=4
                pnpm exec turbo run desktop:build:linux --filter=@bb/desktop --only --summarize
              ' > "$result_dir/run.log" 2>&1
            else
              /usr/bin/time -f '{"seconds":%e,"exitCode":%x}' -o "$result_dir/time.json" pnpm exec turbo run 'bb-app#smoke:tarball' '@bb/desktop#desktop:build:linux' --only --summarize --concurrency=4 --continue=dependencies-successful > "$result_dir/run.log" 2>&1
            fi
            cp .turbo/runs/*.json "$result_dir/"
            rg --files --hidden --no-ignore apps/desktop/release > "$result_dir/desktop-files.txt"
            if rg 'SLOP-CACHE-STALE' "$result_dir/desktop-files.txt"; then
              exit 1
            fi
          done
      - uses: ./.github/actions/install-appimage-fuse
        with:
          package: libfuse2t64
      - name: Smoke Linux AppImage lifecycle
        run: xvfb-run -a pnpm exec turbo run smoke:appimage-lifecycle --filter=@bb/desktop --force > "$RUNNER_TEMP/lifecycle.log" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: packaging-paired-${{ matrix.order }}-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/results/
            ${{ runner.temp }}/prepare.log
            ${{ runner.temp }}/lifecycle.log
