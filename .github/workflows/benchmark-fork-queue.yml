name: Measure plugin fork queue
on:
  push:
    branches: [bb/benchmark-fork-queue-20261024]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
        shard: [2, 3]
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore baseline scheduling
        if: matrix.variant == 'baseline'
        run: |
          git fetch --depth=1 origin 7f3414a707a54519749d098165e3a98ff73a4b88
          git show FETCH_HEAD:scripts/check-plugin-forks.mjs > scripts/check-plugin-forks.mjs
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
      - name: Install workspace
        run: bash .github/actions/setup-workspace/install-dependencies.sh
      - uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"
      - name: Prepare SDK and CLI
        run: pnpm exec turbo run build build:types --filter=@get-bb/plugin-sdk --filter=@bb/cli --output-logs=errors-only
      - name: Check external plugin forks
        env:
          VITEST_MAX_WORKERS: "2"
        run: /usr/bin/time -f '{"seconds":%e,"exitCode":%x}' -o "$RUNNER_TEMP/fork-time.json" node scripts/check-plugin-forks.mjs --shard=${{ matrix.shard }}/3 > "$RUNNER_TEMP/fork.log" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fork-queue-${{ matrix.variant }}-${{ matrix.shard }}-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/fork.log
            ${{ runner.temp }}/fork-time.json
            ${{ runner.temp }}/plugin-fork-evidence/**/package.json
            ${{ runner.temp }}/plugin-fork-evidence/**/package-lock.json
