name: Measure Windows Pi timeout tests
on:
  push:
    branches: [bb/benchmark-fork-queue-20261024]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ${{ matrix.os == 'windows' && 'blacksmith-4vcpu-windows-2025' || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
        os: [windows]
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore baseline tests
        if: matrix.variant == 'baseline'
        run: |
          git fetch --depth=1 origin 7f3414a707a54519749d098165e3a98ff73a4b88
          git show FETCH_HEAD:plugins/provider-pi/src/bridge/bridge.lifecycle.test.ts > plugins/provider-pi/src/bridge/bridge.lifecycle.test.ts
          git show FETCH_HEAD:plugins/provider-pi/src/bridge/catalog.test.ts > plugins/provider-pi/src/bridge/catalog.test.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install workspace
        run: bash .github/actions/setup-workspace/install-dependencies.sh
      - uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"
      - name: Prepare SDK and CLI
        run: pnpm exec turbo run build build:types --filter=@get-bb/plugin-sdk --filter=@bb/cli --output-logs=errors-only
      - name: Test complete Pi suite
        env:
          VITEST_MAX_WORKERS: "2"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm exec turbo run test --filter=bb-plugin-provider-pi -- --reporter=json --outputFile="$RUNNER_TEMP/pi-results.json" > "$RUNNER_TEMP/pi.log" 2>&1
      - name: Check real standalone fork shard
        if: matrix.os == 'ubuntu'
        env:
          VITEST_MAX_WORKERS: "2"
        run: /usr/bin/time -f '{"seconds":%e,"exitCode":%x}' -o "$RUNNER_TEMP/fork-time.json" node scripts/check-plugin-forks.mjs --shard=1/3 > "$RUNNER_TEMP/fork.log" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pi-waits-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/pi-results.json
            ${{ runner.temp }}/pi.log
            ${{ runner.temp }}/fork.log
            ${{ runner.temp }}/fork-time.json
