name: Measure host package test waits
on:
  push:
    branches: [bb/benchmark-host-waits-20261024]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
        replica: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore baseline test files
        if: matrix.variant == 'baseline'
        run: |
          git fetch --depth=1 origin 86be00767d3831d02b1cc0955a68062fdcebc537
          git show 86be00767d3831d02b1cc0955a68062fdcebc537:packages/config/test/verified-process-stop.test.ts > packages/config/test/verified-process-stop.test.ts
          git show 86be00767d3831d02b1cc0955a68062fdcebc537:packages/provider-bridge-acp/src/bridge/bridge.test.ts > packages/provider-bridge-acp/src/bridge/bridge.test.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
      - name: Report resources
        run: node -e 'const os=require("node:os"); console.log(JSON.stringify({cpus:os.availableParallelism(),model:os.cpus()[0].model}))'
      - name: Install foundation dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter bb --filter "@bb/process-utils..." --filter "@bb/host-workspace..." --filter "@bb/host-watcher..." --filter "@bb/agent-runtime..." --filter "@bb/provider-bridge-protocol..." --filter "@bb/provider-bridge-acp..." --filter "@bb/host-daemon-contract..." --filter "@bb/config..." --filter "@bb/db..." --filter "bb-plugin-provider-acp..." --filter "bb-plugin-provider-codex..." --filter "bb-plugin-provider-claude-code..." --filter "bb-plugin-echo-provider..." --filter "@bb/app..."
      - name: Lint and test foundation packages
        run: pnpm exec turbo run lint test --filter=@bb/process-utils --filter=@bb/host-workspace --filter=@bb/host-watcher --filter=@bb/agent-runtime --filter=@bb/provider-bridge-protocol --filter=@bb/provider-bridge-acp --filter=@bb/host-daemon-contract --filter=@bb/config --filter=@bb/db --cache-dir=.turbo/host-wait-benchmark --cache=local:rw --continue --concurrency=2 --output-logs=new-only --summarize > "$RUNNER_TEMP/host-waits.log" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: host-waits-${{ matrix.variant }}-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/host-waits.log
            .turbo/runs/*.json
          include-hidden-files: true
