name: Compare Windows app test scheduling
on:
  push:
    branches: [bb/benchmark-platform-critical-20261025]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
        shard: [1, 2, 3, 4]
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore baseline order
        if: matrix.variant == 'baseline'
        shell: bash
        run: |
          git fetch --depth=1 origin 8ee6cb6c7573825f96d77993f2e3308d1b0003e5
          git show FETCH_HEAD:apps/app/vitest.config.ts > apps/app/vitest.config.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Restore Windows dependency disk
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache
      - name: Install app dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter bb --filter '@bb/app...' --filter '@bb/db...'
      - name: Test app shard
        shell: cmd
        env:
          VITEST_MAX_WORKERS: '4'
          BB_CI_TEST_SHARD: ${{ matrix.shard }}/4
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm exec turbo run test --filter=@bb/app --summarize -- --reporter=json --outputFile="%RUNNER_TEMP%\app-tests.json" > "%RUNNER_TEMP%\app-tests.log" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: app-order-${{ matrix.variant }}-${{ matrix.shard }}-${{ matrix.replica }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/app-tests.json
            ${{ runner.temp }}/app-tests.log
            .turbo/runs/*.json
