name: Profile Windows package installation
on:
  push:
    branches: [bb/profile-windows-smoke-npm-20261025]
permissions:
  contents: read
jobs:
  profile:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: 22.x
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Build bb-app and boot it
        shell: bash
        run: pnpm exec turbo run smoke:boot --filter=bb-app --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only

      - name: Restore npm package downloads
        id: npm-downloads
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-npm-downloads

      - name: Profile real tarball installs twice
        shell: bash
        env:
          npm_config_timing: 'true'
          npm_config_logs_dir: ${{ runner.temp }}/npm-timing
          npm_config_logs_max: '100'
        run: |
          mkdir -p "$RUNNER_TEMP/npm-timing"
          for repetition in 1 2; do
            pnpm exec turbo run smoke:tarball --filter=bb-app --env-mode=loose --output-logs=new-only > "$RUNNER_TEMP/smoke-$repetition.log" 2>&1
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-npm-profile
          path: |
            ${{ runner.temp }}/npm-timing/*-timing.json
            ${{ runner.temp }}/smoke-*.log
