name: Verify deterministic account deadlines and faster skill scans
on:
  push:
    branches:
      - bb/benchmark-windows-dependencies-20261024
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            mode: original
            replica: 1
            runner: blacksmith-4vcpu-windows-2025
          - os: windows
            mode: original
            replica: 2
            runner: blacksmith-4vcpu-windows-2025
          - os: windows
            mode: optimized
            replica: 1
            runner: blacksmith-4vcpu-windows-2025
          - os: windows
            mode: optimized
            replica: 2
            runner: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Report runner resources
        run: node -e "const os=require('node:os');
          console.log(JSON.stringify({parallelism:os.availableParallelism(),cpus:os.cpus().length,memoryGiB:os.totalmem()/2**30,model:os.cpus()[0].model}))"
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Apply faster fixtures
        shell: bash
        run: git apply .github/benchmarks/runtime.patch
      - name: Restore dependency image
        id: dependencies
        uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
        if: matrix.os == 'windows'
      - name: Require warm image
        if: matrix.os == 'windows' && (steps.dependencies.outputs.active != 'true')
        run: throw 'Dependency image missing; do not mix cold setup into this
          comparison'
      - name: Apply timing fixes
        if: matrix.mode == 'optimized'
        shell: bash
        run: git apply .github/benchmarks/timing-failures.patch
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter '!@bb/mobile'
      - name: Test Skill-index
        shell: bash
        env:
          VITEST_MAX_WORKERS: "2"
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: pnpm exec turbo run test --filter=@bb/skill-index --force
          --output-logs=errors-only --concurrency=2 --summarize --
          --reporter=json --outputFile="$RUNNER_TEMP/Skill-index.json"
      - name: Test Connect-next
        shell: bash
        env:
          VITEST_MAX_WORKERS: "2"
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: pnpm exec turbo run test --filter=@bb/connect-next --force
          --output-logs=errors-only --concurrency=2 --summarize --
          --reporter=json --outputFile="$RUNNER_TEMP/Connect-next.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: timing-${{ matrix.mode }}-${{ matrix.replica }}
          path: |-
            .turbo/runs/*.json
            ${{ runner.temp }}/*.json
          include-hidden-files: true
