name: Benchmark CI test parallelism with unchanged coverage
on:
  push:
    branches:
      - bb/benchmark-windows-dependencies-20261024
permissions:
  contents: read
jobs:
  app:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: original
            shard: 1
            vitestShard: 1/4
          - mode: original
            shard: 2
            vitestShard: 2/4
          - mode: original
            shard: 3
            vitestShard: 3/4
          - mode: original
            shard: 4
            vitestShard: 4/4
          - mode: parallel
            shard: 1
            vitestShard: 1/8
          - mode: parallel
            shard: 2
            vitestShard: 2/8
          - mode: parallel
            shard: 3
            vitestShard: 3/8
          - mode: parallel
            shard: 4
            vitestShard: 4/8
          - mode: parallel
            shard: 5
            vitestShard: 5/8
          - mode: parallel
            shard: 6
            vitestShard: 6/8
          - mode: parallel
            shard: 7
            vitestShard: 7/8
          - mode: parallel
            shard: 8
            vitestShard: 8/8
    steps:
      - &a1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - &a2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - &a3
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - &a4
        name: Apply faster fixtures
        if: matrix.mode == 'parallel'
        shell: bash
        run: git apply .github/benchmarks/runtime.patch
      - name: Restore dependency image
        id: dependencies
        uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
      - name: Require warm image
        if: steps.dependencies.outputs.active != 'true'
        run: throw 'Dependency image missing; do not mix cold setup into this
          comparison'
      - name: Install app dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter bb --filter "@bb/app..." --filter
          "@bb/db..."
      - name: Run app shard
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          BB_CI_TEST_SHARD: ${{ matrix.vitestShard }}
        run: pnpm exec turbo run test --filter=@bb/app --force --output-logs=errors-only
          --summarize --concurrency=2 -- --reporter=json
          --outputFile="%RUNNER_TEMP%/app-results.json"
      - &a5
        name: Upload timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.job }}-${{ matrix.mode }}-${{ matrix.shard }}
          path: |-
            .turbo/runs/*.json
            ${{ runner.temp }}/app-results.json
  plugins:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: original
            shard: all
            filter: --filter='bb-plugin-*'
          - mode: parallel
            shard: providers
            filter: --filter='bb-plugin-provider-*'
          - mode: parallel
            shard: other
            filter: --filter='bb-plugin-*' --filter='!bb-plugin-provider-*'
    steps:
      - *a1
      - *a2
      - *a3
      - *a4
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter '!@bb/mobile'
      - uses: ./.github/actions/setup-bun
        with:
          version: 1.3.14
      - name: Test plugins
        env:
          VITEST_MAX_WORKERS: "2"
        run: pnpm exec turbo run test ${{ matrix.filter }} --force
          --output-logs=errors-only --summarize --concurrency=4
      - *a5
