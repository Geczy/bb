name: Compare worker counts in the slow Windows package group
on:
  push:
    branches:
      - bb/benchmark-windows-dependencies-20261024
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: workers-2
            workers: 2
            replica: 1
            os: windows
            runner: blacksmith-4vcpu-windows-2025
          - mode: workers-2
            workers: 2
            replica: 2
            os: windows
            runner: blacksmith-4vcpu-windows-2025
          - mode: workers-3
            workers: 3
            replica: 1
            os: windows
            runner: blacksmith-4vcpu-windows-2025
          - mode: workers-3
            workers: 3
            replica: 2
            os: windows
            runner: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Report runner resources
        run: node -e "const os=require('node:os');
          console.log(JSON.stringify({parallelism:os.availableParallelism(),cpus:os.cpus().length,memoryGiB:os.totalmem()/2**30,model:os.cpus()[0].model}))"
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Apply faster fixtures
        shell: bash
        run: git apply .github/benchmarks/runtime.patch
      - name: Restore dependency image
        id: dependencies
        uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
        if: matrix.os == 'windows'
      - name: Require warm image
        if: matrix.os == 'windows' && (steps.dependencies.outputs.active != 'true')
        run: throw 'Dependency image missing; do not mix cold setup into this
          comparison'
      - name: Apply timing fixes
        shell: bash
        run: git apply .github/benchmarks/timing-failures.patch
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter '!@bb/mobile'
      - name: Test package group
        shell: cmd
        env:
          VITEST_MAX_WORKERS: ${{ matrix.workers }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: pnpm exec turbo run test --filter=!@bb/server --filter=!@bb/app
          --filter=!bb-plugin-* --filter=!@bb/host-daemon --filter=!@bb/cli
          --filter=!@bb/integration-tests --filter=!@bb/templates
          --filter=!bb-app --filter=!@bb/demo-server --filter=!@bb/desktop
          --filter=!@bb/plugin-build --filter=!@bb/process-utils
          --filter=!@bb/host-workspace --filter=!@bb/host-watcher
          --filter=!@bb/agent-runtime --filter=!@bb/provider-bridge-protocol
          --filter=!@bb/provider-bridge-acp --filter=!@bb/host-daemon-contract
          --filter=!@bb/config --filter=!@bb/db --force --continue
          --output-logs=errors-only --concurrency=2 --summarize
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-workers-${{ matrix.workers }}-${{ matrix.replica }}
          path: |-
            .turbo/runs/*.json
            ${{ runner.temp }}/*.json
          include-hidden-files: true
