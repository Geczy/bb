name: Validate Windows dependency image across full matrix
on:
  push:
    branches:
      - bb/benchmark-windows-dependencies-20261024
permissions:
  contents: read
env:
  PRIMARY_NODE_VERSION: 22.x
  PNPM_VERSION: 9.15.0
jobs:
  seed:
    name: Warm Windows dependencies
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts
      - name: Prepare missing dependency image
        id: dependencies
        timeout-minutes: 1
        uses: ./.github/actions/windows-dependency-cache
        with:
          seed: "true"
      - name: Populate dependency image
        if: steps.dependencies.outputs.active == 'true'
        timeout-minutes: 5
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter '!@bb/mobile'
      - name: Detach populated dependency image
        if: steps.dependencies.outputs.active == 'true'
        timeout-minutes: 1
        run: ./.github/actions/windows-dependency-cache/disk.ps1 detach
      - name: Save dependency image before builds modify it
        if: steps.dependencies.outputs.active == 'true'
        timeout-minutes: 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bb-dependencies.vhdx
          key: ${{ steps.dependencies.outputs.key }}
  plan:
    name: Select CI checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: select
        shell: bash
        run: echo "selection=$(node scripts/plan-ci.mjs --full)" >> "$GITHUB_OUTPUT"
  windows-foundation:
    needs:
      - plan
      - seed
    if: ${{ fromJSON(needs.plan.outputs.selection).foundation }}
    name: Windows host packages (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts
      - name: Restore Windows dependency disk
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache
      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-foundation
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"
      - name: Install foundation dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter bb --filter "@bb/process-utils..." --filter
          "@bb/host-workspace..." --filter "@bb/host-watcher..." --filter
          "@bb/agent-runtime..." --filter "@bb/provider-bridge-protocol..."
          --filter "@bb/provider-bridge-acp..." --filter
          "@bb/host-daemon-contract..." --filter "@bb/config..." --filter
          "@bb/db..." --filter "bb-plugin-provider-acp..." --filter
          "bb-plugin-provider-codex..." --filter
          "bb-plugin-provider-claude-code..." --filter
          "bb-plugin-echo-provider..." --filter "@bb/app..."
      - name: Lint and test foundation packages
        shell: bash
        run: pnpm exec turbo run lint test --filter=@bb/process-utils
          --filter=@bb/host-workspace --filter=@bb/host-watcher
          --filter=@bb/agent-runtime --filter=@bb/provider-bridge-protocol
          --filter=@bb/provider-bridge-acp --filter=@bb/host-daemon-contract
          --filter=@bb/config --filter=@bb/db
          --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --continue
          --concurrency=2 --output-logs=new-only --summarize --force
      - name: Bound saved Turbo cache
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 256
          --keep-run-summaries .turbo/runs
  windows-app-smoke:
    needs:
      - plan
      - seed
    if: ${{ fromJSON(needs.plan.outputs.selection).packaging }}
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts
      - name: Restore Windows dependency disk
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache
      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler
      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"
      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm
      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter '!@bb/mobile'
      - name: Build bb-app and boot it
        shell: bash
        run: pnpm exec turbo run smoke:boot --filter=bb-app
          --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only
          --force
      - name: Smoke test the bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --output-logs=new-only
          --force
      - name: Bound saved Turbo cache
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 256
  windows-desktop-smoke:
    needs:
      - plan
      - seed
    if: ${{ fromJSON(needs.plan.outputs.selection).packaging }}
    name: Windows desktop smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts
      - name: Restore Windows dependency disk
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache
      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler
      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-desktop-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"
      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm
      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter '!@bb/mobile'
      - name: Package the desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: pnpm exec turbo run package:win --filter=@bb/desktop
          --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only
          --force
      - name: Smoke test the packaged desktop app
        shell: bash
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force
          --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only
      - name: Bound saved Turbo cache
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 256
  windows-tests:
    name: Windows tests (${{ matrix.shard }}, Node 22.x)
    needs:
      - plan
      - seed
    if: ${{ fromJSON(needs.plan.outputs.selection)['windows-tests'].include[0] !=
      null }}
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.selection)['windows-tests'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts
      - name: Restore Windows dependency disk
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache
      - name: Restore React Compiler cache
        if: ${{ contains(matrix.filter, '--filter=@bb/demo-server') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler
      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-test-${{ matrix.shard }}
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"
      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm
      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
          APP_SHARD: ${{ startsWith(matrix.shard, 'app-') }}
          SERVER_SHARD: ${{ startsWith(matrix.shard, 'server-') }}
          MOBILE_TESTS: ${{ matrix.mobile }}
        run: >
          filters=()

          if [[ "$APP_SHARD" == "true" ]]; then
            filters=(--filter bb --filter '@bb/app...' --filter '@bb/db...')
          elif [[ "$SERVER_SHARD" == "true" ]]; then
            filters=(--filter bb --filter '@bb/server...' --filter '@bb/host-daemon...' --filter '@bb/app...' --filter 'bb-plugin-*...')
          elif [[ "$MOBILE_TESTS" != "true" ]]; then
            filters=(--filter '!@bb/mobile')
          fi

          bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts "${filters[@]}"
      - name: Setup Bun
        if: ${{ matrix.shard == 'plugins-1' }}
        timeout-minutes: 4
        uses: ./.github/actions/setup-bun
        with:
          version: 1.3.14
      - name: Test on Windows
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          BB_CI_TEST_SHARD: ${{ matrix.vitestShard }}
        run: >
          if not defined TURBO_CACHE_DIR set TURBO_CACHE_DIR=.turbo/cache

          pnpm exec turbo run test ${{ matrix.filter }}
          --cache-dir="%TURBO_CACHE_DIR%" --continue --output-logs=new-only
          --summarize --concurrency=${{ matrix.concurrency }} --force
      - name: Upload test timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-timings-windows-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - name: Bound saved Turbo cache
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 256
          --keep-run-summaries .turbo/runs
