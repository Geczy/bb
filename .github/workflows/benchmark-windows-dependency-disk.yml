name: Benchmark Windows whole workspace on ReFS
on:
  push:
    branches: [bb/benchmark-windows-dependencies-20261024]
permissions:
  contents: read
jobs:
  measure:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [original, refs]
        repetition: [1, 2]
    defaults:
      run:
        working-directory: ${{ matrix.mode == 'refs' && 'P:/workspace' || github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Setup pnpm
        working-directory: ${{ github.workspace }}
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Move checkout and temporary files to ReFS
        if: matrix.mode == 'refs'
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/benchmark-windows-dependency-disk.ps1 create
          robocopy $env:GITHUB_WORKSPACE P:\workspace /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "Workspace copy failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Path P:\tmp | Out-Null
          'TEMP=P:\tmp' | Out-File -Append $env:GITHUB_ENV
          'TMP=P:\tmp' | Out-File -Append $env:GITHUB_ENV
          exit 0
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Compile SDK declarations
        shell: cmd
        run: pnpm exec turbo run build:types --filter=@get-bb/plugin-sdk --force --output-logs=errors-only --summarize
      - name: Run app shard
        shell: cmd
        env:
          BB_CI_TEST_SHARD: 1/4
        run: pnpm exec turbo run test --filter=@bb/app --force --output-logs=errors-only --summarize --concurrency=2
      - name: Run Pi provider tests
        shell: cmd
        run: pnpm exec turbo run test --filter=bb-plugin-provider-pi --force --output-logs=errors-only --summarize --concurrency=2
      - name: Upload task timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workspace-${{ matrix.mode }}-${{ matrix.repetition }}
          path: ${{ matrix.mode == 'refs' && 'P:/workspace' || github.workspace }}/.turbo/runs/*.json
