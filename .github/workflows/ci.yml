name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    name: Declaration cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare build prerequisites
        run: pnpm exec turbo run build:types --filter=@get-bb/plugin-sdk --output-logs=new-only > declarations-prepare.log 2>&1
      - name: Build before 1
        run: node scripts/ci-bench/declarations.mjs before-1
      - name: Build after 1
        run: node scripts/ci-bench/declarations.mjs after-1
      - name: Build after 2
        run: node scripts/ci-bench/declarations.mjs after-2
      - name: Build before 2
        run: node scripts/ci-bench/declarations.mjs before-2
      - name: Build before 3
        run: node scripts/ci-bench/declarations.mjs before-3
      - name: Build after 3
        run: node scripts/ci-bench/declarations.mjs after-3
      - name: Build after 4
        run: node scripts/ci-bench/declarations.mjs after-4
      - name: Build before 4
        run: node scripts/ci-bench/declarations.mjs before-4
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: declarations-measurements-${{ runner.os }}
          path: declarations-*
