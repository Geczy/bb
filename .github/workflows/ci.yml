name: CI
on:
  workflow_dispatch:
jobs:
  benchmark:
    name: Test fixtures (${{ matrix.platform }}, ${{ matrix.scope }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, Windows]
        scope: [db, cli, combined]
        include:
          - platform: Linux
            runner: blacksmith-4vcpu-ubuntu-2404
            concurrency: 4
          - platform: Windows
            runner: blacksmith-4vcpu-windows-2025
            concurrency: 2
    defaults:
      run:
        shell: bash
    env:
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare prerequisites
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          git show 2884950f17e76f78b28c64ccf4a2e9a7c74188a8:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm exec turbo run test --filter=@bb/db --filter=@bb/cli --output-logs=errors-only
      - name: Compare complete affected suites
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          mkdir -p measurements
          filters=(--filter=@bb/db --filter=@bb/cli)
          if [[ "${{ matrix.scope }}" == db ]]; then filters=(--filter=@bb/db); fi
          if [[ "${{ matrix.scope }}" == cli ]]; then filters=(--filter=@bb/cli); fi
          files="apps/cli/src/__tests__/cli-entry-errors.e2e.test.ts apps/cli/src/__tests__/command-output/machine.test.ts apps/cli/src/__tests__/command-output/updates.test.ts apps/cli/src/__tests__/plugin-cli-broken-pipe.e2e.test.ts apps/cli/src/__tests__/startup-graph.test.ts packages/db/test/data/event-ingestion-work.test.ts packages/db/test/data/prompt-history.test.ts packages/db/test/data/provider-model-catalogs.test.ts packages/db/test/experiments.test.ts packages/db/test/prepared-queries.test.ts packages/db/test/schema.test.ts turbo.json"
          for file in $files; do
            name=$(basename "$file")
            cp "$file" "$RUNNER_TEMP/after-$name"
            git show 2884950f17e76f78b28c64ccf4a2e9a7c74188a8:"$file" > "$RUNNER_TEMP/before-$name"
          done
          for round in 1 2 3; do
            variants="before after"
            if [[ "$round" == 2 ]]; then variants="after before"; fi
            for variant in $variants; do
              for file in $files; do
                cp "$RUNNER_TEMP/$variant-$(basename "$file")" "$file"
              done
              pnpm exec turbo run test "${filters[@]}" --force --output-logs=full --summarize --concurrency=${{ matrix.concurrency }} > "measurements/$round-$variant.log" 2>&1
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-batch-${{ matrix.platform }}-${{ matrix.scope }}
          path: measurements
