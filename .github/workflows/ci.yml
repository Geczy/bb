name: CI
on:
  workflow_dispatch:
jobs:
  benchmark:
    name: Database fixtures (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - platform: Windows
            runner: blacksmith-4vcpu-windows-2025
    defaults:
      run:
        shell: bash
    env:
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare prerequisites
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          git show 937cca40b740b76b75411f109273117039bf28c8:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm exec turbo run test --filter=@bb/db --output-logs=errors-only
      - name: Compare complete database suite
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          mkdir -p measurements
          files=".bb/skills/verify-bb/features/projects-environments.md apps/app/.ladle/plugin-sdk-app.ts apps/app/package.json apps/app/src/components/promptbox/banner/ThreadPromptContextBanner.stories.tsx apps/app/src/components/promptbox/banner/ThreadPromptContextBanner.test.tsx apps/app/src/components/promptbox/banner/ThreadPromptContextBanner.tsx apps/app/src/components/pull-request/PullRequestStatusPill.tsx apps/app/src/components/secondary-panel/ThreadMetadataContent.fixtures.tsx apps/app/src/components/secondary-panel/ThreadMetadataContent.tsx apps/app/src/hooks/cache-owners/query-cache.ts apps/app/src/hooks/cache-owners/realtime-cache-registry.ts apps/app/src/hooks/mutations/environment-mutations.ts apps/app/src/hooks/queries/environment-queries.test.tsx apps/app/src/hooks/queries/environment-queries.ts apps/app/src/hooks/queries/pull-request-queries.test.tsx apps/app/src/hooks/queries/pull-request-queries.ts apps/app/src/hooks/queries/query-helpers.test.ts apps/app/src/hooks/queries/query-keys.ts apps/app/src/hooks/realtime-cache-effects.test.ts apps/app/src/hooks/realtime-cache-effects.ts apps/app/src/hooks/useRealtimeSubscription.ts apps/app/src/lib/plugin-frontend.test.ts apps/app/src/lib/plugin-frontend.ts apps/app/src/lib/plugin-sdk-app-impl.tsx apps/app/src/lib/plugin-sdk-hooks.ts apps/app/src/lib/plugin-sidebar-hooks.ts apps/app/src/lib/pull-request-display.test.ts apps/app/src/lib/pull-request-display.ts apps/app/src/lib/ws.test.ts apps/app/src/lib/ws.ts apps/app/src/views/thread-detail/ThreadDetailPromptArea.tsx apps/app/src/views/thread-detail/ThreadDetailView.tsx apps/cli/package.json apps/cli/src/__tests__/command-output/environment.test.ts apps/cli/src/__tests__/command-output/thread-show.test.ts apps/cli/src/commands/environment.ts apps/cli/src/commands/plugin.ts apps/cli/src/commands/thread/show.ts apps/host-daemon/src/command-dispatch.test.ts apps/host-daemon/src/command-dispatch.ts apps/host-daemon/src/runtime-manager.test.ts apps/host-daemon/src/terminals/terminal-manager.test.ts apps/host-daemon/src/watch-manager.test.ts apps/host-daemon/test/command/dispatch-helpers.ts apps/host-daemon/test/command/workspace-dispatch.test.ts apps/server/src/internal/command-results.ts apps/server/src/routes/environments.ts apps/server/src/services/environments/pull-request-watch.ts apps/server/src/services/environments/pull-request.test.ts apps/server/src/services/environments/pull-request.ts apps/server/src/services/environments/workspace-read-cache.test.ts apps/server/src/services/environments/workspace-read-cache.ts apps/server/src/services/hosts/wake-policy.ts apps/server/src/services/plugins/builtin-registry.ts apps/server/src/services/plugins/managed-plugin-artifacts.ts apps/server/src/services/plugins/plugin-api.ts apps/server/src/services/plugins/plugin-log.ts apps/server/src/services/plugins/plugin-runtime.ts apps/server/src/services/plugins/plugin-service-internal.ts apps/server/src/services/plugins/plugin-service.ts apps/server/test/app/client-protocol.test.ts apps/server/test/app/host-shared-ports.test.ts apps/server/test/app/hub.test.ts apps/server/test/environments/pull-request-watch.test.ts apps/server/test/environments/workspace-read-cache-routes.test.ts apps/server/test/public/public-environment-action-regressions.test.ts apps/server/test/services/plugins/builtin-plugins.test.ts apps/server/test/services/plugins/official-plugins.test.ts apps/server/test/services/plugins/plugin-agent-contributions.test.ts apps/server/test/services/plugins/plugin-agent-tools.test.ts apps/server/test/services/plugins/plugin-background.test.ts apps/server/test/services/plugins/plugin-cache-prune.test.ts apps/server/test/services/plugins/plugin-dev-build-problems.test.ts apps/server/test/services/plugins/plugin-host-build-policy.test.ts apps/server/test/services/plugins/plugin-install-hook.test.ts apps/server/test/services/plugins/plugin-install.test.ts apps/server/test/services/plugins/plugin-mention-providers.test.ts apps/server/test/services/plugins/plugin-native-server-loading.test.ts apps/server/test/services/plugins/plugin-safe-mode.test.ts apps/server/test/services/plugins/plugin-sdk.test.ts apps/server/test/services/plugins/plugin-service.test.ts apps/server/test/services/plugins/plugin-settings-storage.test.ts apps/server/test/services/plugins/plugin-update.test.ts apps/server/test/services/plugins/prebuilt-server-loading.test.ts apps/server/test/services/plugins/retired-bundled-plugins.test.ts apps/web/src/marketplace/marketplace-icons.ts docs/api_to_audit.md packages/bundled-plugins/package.json packages/db/test/data/event-ingestion-work.test.ts packages/db/test/data/prompt-history.test.ts packages/db/test/data/provider-model-catalogs.test.ts packages/db/test/experiments.test.ts packages/db/test/prepared-queries.test.ts packages/db/test/schema.test.ts packages/domain/src/change-kinds.ts packages/domain/src/plugin-sdk-version.ts packages/domain/src/thread.ts packages/domain/test/change-kinds.test.ts packages/host-daemon-contract/src/commands.ts packages/host-daemon-contract/src/protocol.ts packages/host-daemon-contract/src/session.ts packages/host-daemon-contract/test/contract.test.ts packages/host-workspace/src/git-host.ts packages/host-workspace/src/index.ts packages/host-workspace/src/provision.ts packages/host-workspace/src/workspace.ts packages/host-workspace/test/git-host-upstream.test.ts packages/host-workspace/test/git-host.test.ts packages/host-workspace/test/workspace.test.ts packages/plugin-build/src/build-plugin-app.test.ts packages/plugin-build/src/build-plugin-app.ts packages/plugin-sdk/package.json packages/plugin-sdk/src/app-contract.ts packages/plugin-sdk/src/app.ts packages/plugin-sdk/src/backend-contract.ts packages/plugin-sdk/src/internal/rpc-query-host.ts packages/plugin-sdk/src/testing/__tests__/rpc-query-host.test.tsx packages/plugin-sdk/src/testing/app.tsx packages/plugin-sdk/src/testing/fake-plugin-host.ts packages/sdk/src/areas/environments.ts packages/sdk/test/public-types.test.ts packages/sdk/test/sdk.test.ts packages/server-contract/src/api/environments.ts packages/server-contract/src/client-route-descriptors.ts packages/server-contract/src/public-api.ts packages/server-contract/test/contract.test.ts packages/templates/src/templates/bb-guide-environments.md plugins/bb-guide/skills/bb-cli/references/command-index.md plugins/bb-guide/skills/bb-plugin-authoring/SKILL.md plugins/bb-guide/skills/bb-plugin-authoring/references/backend-api-index.md plugins/bb-guide/skills/bb-plugin-authoring/references/backend-sdk.md plugins/bb-guide/skills/bb-plugin-authoring/references/frontend-api-index.md plugins/bb-guide/skills/bb-plugin-authoring/references/frontend-pull-requests.md plugins/bb-guide/skills/bb-plugin-authoring/references/frontend-registration.md plugins/bb-official.json plugins/github-pr-status/PLUGIN_OVERVIEW.md plugins/github-pr-status/README.md plugins/github-pr-status/contract.ts plugins/github-pr-status/host.ts plugins/github-pr-status/host/git-host.test.ts plugins/github-pr-status/package.json plugins/github-pr-status/server.test.ts plugins/github-pr-status/server.ts plugins/github-pr-status/skills/github-pr-status/SKILL.md plugins/github-pr-status/store.test.ts plugins/github-pr-status/store.ts plugins/github-pr-status/test/fake-gh.ts plugins/github-pr-status/tsconfig.json plugins/github-pr-status/vitest.config.ts plugins/github/server.ts plugins/mcp/src/policy.test.ts plugins/mcp/src/policy.ts plugins/plugin-api-docs/src/first-party-plugins.json plugins/plugin-api-docs/src/surfaces.ts plugins/tasks/api/api.test.ts plugins/tasks/api/index.ts plugins/tasks/cli/cli.test.ts pnpm-lock.yaml turbo.json"
          for file in $files; do
            name=$(basename "$file")
            cp "$file" "$RUNNER_TEMP/after-$name"
            git show 937cca40b740b76b75411f109273117039bf28c8:"$file" > "$RUNNER_TEMP/before-$name"
          done
          for round in 1 2 3; do
            variants="before after"
            if [[ "$round" == 2 ]]; then variants="after before"; fi
            for variant in $variants; do
              for file in $files; do
                cp "$RUNNER_TEMP/$variant-$(basename "$file")" "$file"
              done
              pnpm exec turbo run test --filter=@bb/db --only --force --output-logs=full --summarize > "measurements/$round-$variant.log" 2>&1
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-fixtures-${{ matrix.platform }}
          path: measurements
