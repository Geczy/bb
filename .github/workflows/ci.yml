name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: '22.x'
  PNPM_VERSION: '9.15.0'
jobs:
  serial:
    name: Serial validation (${{ matrix.replica }})
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      base: ${{ steps.comparison.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Check source files for literal NUL bytes
        run: node scripts/check-source-nul.mjs
      - name: Resolve comparison base
        id: comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "base=$(node scripts/ci-comparison-base.mjs "$BASE_SHA" "$PR_HEAD_SHA")" >> "$GITHUB_OUTPUT"
      - name: Select affected checks
        id: select
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          selection=$(node scripts/plan-ci.mjs --full)
          if [[ -n "$PR_HEAD_SHA" && -n "$BASE_SHA" ]]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" && npx --yes turbo@2.10.12 query affected --base "$BASE_SHA" --head HEAD > "$RUNNER_TEMP/ci-affected.json"; then
              selection=$(node scripts/plan-ci.mjs --base "$BASE_SHA" --affected "$RUNNER_TEMP/ci-affected.json")
            else
              echo "::warning::Change detection failed; running full CI."
            fi
          fi
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "$selection" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison base: $BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Check dependency inputs
        id: dependencies
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
        run: echo "required=$(node scripts/ci-dependencies-changed.mjs "$BASE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Setup dependency validation tools
        if: steps.dependencies.outputs.required == 'true'
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Validate frozen dependency installation
        if: steps.dependencies.outputs.required == 'true'
        timeout-minutes: 5
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts

      - name: Check provider-literal ratchet
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_BRANCH" || true
          node scripts/check-provider-literal-ratchet.mjs --base "origin/$BASE_BRANCH"

  parallel:
    name: Parallel selection (${{ matrix.replica }})
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      base: ${{ steps.comparison.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Check source files for literal NUL bytes
        run: node scripts/check-source-nul.mjs
      - name: Resolve comparison base
        id: comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "base=$(node scripts/ci-comparison-base.mjs "$BASE_SHA" "$PR_HEAD_SHA")" >> "$GITHUB_OUTPUT"
      - name: Select affected checks
        id: select
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          selection=$(node scripts/plan-ci.mjs --full)
          if [[ -n "$PR_HEAD_SHA" && -n "$BASE_SHA" ]]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" && npx --yes turbo@2.10.12 query affected --base "$BASE_SHA" --head HEAD > "$RUNNER_TEMP/ci-affected.json"; then
              selection=$(node scripts/plan-ci.mjs --base "$BASE_SHA" --affected "$RUNNER_TEMP/ci-affected.json")
            else
              echo "::warning::Change detection failed; running full CI."
            fi
          fi
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "$selection" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison base: $BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Check dependency inputs
        id: dependencies
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
        run: echo "required=$(node scripts/ci-dependencies-changed.mjs "$BASE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Check provider-literal ratchet
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_BRANCH" || true
          node scripts/check-provider-literal-ratchet.mjs --base "origin/$BASE_BRANCH"

  validation:
    name: Parallel validation (${{ matrix.replica }})
    needs: parallel
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup dependency validation tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Validate frozen dependency installation
        timeout-minutes: 5
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts

