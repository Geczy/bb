name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    name: Windows dependency store
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Prime dependency store
        timeout-minutes: 5
        run: node scripts/ci-bench/windows-store.mjs install prime
      - name: Save dependency store
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ci-bench-store
          key: windows-store-benchmark-${{ github.run_id }}
      - name: Clear installation and store
        run: node scripts/ci-bench/windows-store.mjs clean
      - name: Install cold 1
        timeout-minutes: 5
        run: node scripts/ci-bench/windows-store.mjs install cold-1
      - name: Clear installation and store
        run: node scripts/ci-bench/windows-store.mjs clean
      - name: Restore dependency store 1
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ci-bench-store
          key: windows-store-benchmark-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Install warm 1
        timeout-minutes: 5
        run: node scripts/ci-bench/windows-store.mjs install warm-1
      - name: Clear installation and store
        run: node scripts/ci-bench/windows-store.mjs clean
      - name: Restore dependency store 2
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ci-bench-store
          key: windows-store-benchmark-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Install warm 2
        timeout-minutes: 5
        run: node scripts/ci-bench/windows-store.mjs install warm-2
      - name: Clear installation and store
        run: node scripts/ci-bench/windows-store.mjs clean
      - name: Install cold 2
        timeout-minutes: 5
        run: node scripts/ci-bench/windows-store.mjs install cold-2
      - name: Clear installation and store
        run: node scripts/ci-bench/windows-store.mjs clean
      - name: Install cold 3
        timeout-minutes: 5
        run: node scripts/ci-bench/windows-store.mjs install cold-3
      - name: Clear installation and store
        run: node scripts/ci-bench/windows-store.mjs clean
      - name: Restore dependency store 3
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ci-bench-store
          key: windows-store-benchmark-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Install warm 3
        timeout-minutes: 5
        run: node scripts/ci-bench/windows-store.mjs install warm-3
      - name: Verify restored store with server tests
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          BB_CI_TEST_SHARD: '2/3'
        run: pnpm exec turbo run test --filter=@bb/server --concurrency=2 --output-logs=new-only --summarize > store-tests.log 2>&1
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-store-measurements
          path: store-*
