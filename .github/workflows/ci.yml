name: CI
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: "22.x"
          pnpm-version: "9.15.0"
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare prerequisites
        run: pnpm exec turbo run build:types ensure-native-modules --filter=@get-bb/plugin-sdk --filter=bb --output-logs=errors-only
      - name: Compare retry backoff
        run: |
          mkdir -p measurements
          file=packages/plugin-sdk/src/testing/__tests__/rpc-query-host.test.tsx
          cp "$file" "$RUNNER_TEMP/rpc-after.tsx"
          git show f90978862583bcb10e0eaa6988237dde9cf114bb:"$file" > "$RUNNER_TEMP/rpc-before.tsx"
          for round in 1 2 3; do
            variants="before after"
            if [[ "$round" == 2 ]]; then variants="after before"; fi
            for variant in $variants; do
              cp "$RUNNER_TEMP/rpc-$variant.tsx" "$file"
              pnpm exec turbo run test --filter=@get-bb/plugin-sdk --only --force --output-logs=full --summarize -- src/testing/__tests__/rpc-query-host.test.tsx > "measurements/$round-$variant.log" 2>&1
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpc-backoff-${{ runner.os }}
          path: measurements
