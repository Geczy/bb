name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    name: Server install (${{ matrix.variant }}, ${{ matrix.replica }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, scoped]
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: '22.x'
          pnpm-version: '9.15.0'
      - name: Install dependencies
        timeout-minutes: 5
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ "$VARIANT" == baseline ]]; then
            bash .github/actions/setup-workspace/install-dependencies.sh --filter '!@bb/mobile'
          else
            bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter bb --filter '@bb/server...' --filter '@bb/host-daemon...' --filter '@bb/app...' --filter 'bb-plugin-*...'
          fi
      - name: Test server shard
        env:
          BB_CI_TEST_SHARD: ${{ matrix.replica == 2 && '2/2' || '1/2' }}
          VITEST_MAX_WORKERS: '2'
        run: pnpm exec turbo run test --filter=@bb/server --output-logs=new-only --summarize --concurrency=4
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-install-${{ matrix.variant }}-${{ matrix.replica }}
          path: .turbo/runs/*.json
          include-hidden-files: true
