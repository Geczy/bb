name: CI
on:
  workflow_dispatch:
jobs:
  benchmark:
    name: Fork workers (${{ matrix.replica }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: "22.x"
          pnpm-version: "9.15.0"
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh
      - uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"
      - name: Prepare prerequisites
        run: pnpm exec turbo run build build:types --filter=@get-bb/plugin-sdk --filter=@bb/cli --output-logs=errors-only
      - name: Measure paired fork checks
        env:
          REPLICA: ${{ matrix.replica }}
        run: |
          mkdir -p measurements
          cp scripts/check-plugin-forks.mjs /tmp/fork-original.mjs
          for round in 1 2; do
            variants="baseline capped"
            if (( (round + REPLICA) % 2 == 0 )); then variants="capped baseline"; fi
            for variant in $variants; do
              cp /tmp/fork-original.mjs scripts/check-plugin-forks.mjs
              if [[ "$variant" == capped ]]; then
                python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("scripts/check-plugin-forks.mjs")
          s = p.read_text()
          before = '["test"], { cwd: target }'
          assert s.count(before) == 1
          p.write_text(s.replace(before, '["test", "--", "--maxWorkers=1"], { cwd: target }'))
          PYTHON
              fi
              export npm_config_cache="$RUNNER_TEMP/npm-$round-$variant"
              start=$(date +%s)
              node scripts/check-plugin-forks.mjs --shard=3/3 > "measurements/$round-$variant.log" 2>&1
              end=$(date +%s)
              echo "$REPLICA,$round,$variant,$((end-start))" | tee -a measurements/timings.csv
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-workers-${{ matrix.replica }}
          path: measurements
