name: CI
on:
  workflow_dispatch:
jobs:
  benchmark:
    name: Server waits (${{ matrix.platform }}, ${{ matrix.scope }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: blacksmith-4vcpu-ubuntu-2404
            scope: focused
          - platform: Windows
            runner: blacksmith-4vcpu-windows-2025
            scope: focused
          - platform: Linux
            runner: blacksmith-4vcpu-ubuntu-2404
            scope: shard
    defaults:
      run:
        shell: bash
    env:
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare prerequisites
        run: |
          git show 93d1fc0c86a8476cb91411880a5d21e44b465908:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm exec turbo run test --filter=@bb/server --output-logs=errors-only -- test/threads/system-message-taxonomy-stamping.test.ts test/services/plugins/plugin-install-hook.test.ts test/app/install-machine-script.test.ts test/services/plugins/plugin-native-server-loading.test.ts
      - name: Compare server tests
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          mkdir -p measurements
          files="apps/server/test/threads/system-message-taxonomy-stamping.test.ts apps/server/test/services/plugins/plugin-install-hook.test.ts apps/server/test/app/install-machine-script.test.ts apps/server/test/services/plugins/plugin-native-server-loading.test.ts"
          for file in $files; do
            name=$(basename "$file")
            cp "$file" "$RUNNER_TEMP/after-$name"
            git show 93d1fc0c86a8476cb91411880a5d21e44b465908:"$file" > "$RUNNER_TEMP/before-$name"
          done
          args=(test/threads/system-message-taxonomy-stamping.test.ts test/services/plugins/plugin-install-hook.test.ts test/app/install-machine-script.test.ts test/services/plugins/plugin-native-server-loading.test.ts)
          if [[ "$SCOPE" == shard ]]; then
            export BB_CI_TEST_SHARD=2/2
            args=()
          fi
          for round in 1 2 3; do
            variants="before after"
            if [[ "$round" == 2 ]]; then variants="after before"; fi
            for variant in $variants; do
              for file in $files; do
                cp "$RUNNER_TEMP/$variant-$(basename "$file")" "$file"
              done
              pnpm exec turbo run test --filter=@bb/server --only --force --output-logs=full --summarize -- "${args[@]}" > "measurements/$round-$variant.log" 2>&1
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-waits-${{ matrix.platform }}-${{ matrix.scope }}
          path: measurements
