name: CI
on:
  workflow_dispatch:
jobs:
  benchmark:
    name: Package tests (${{ matrix.platform }}, ${{ matrix.scope }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [d1, combined]
        include:
          - platform: Linux
            runner: blacksmith-4vcpu-ubuntu-2404
            concurrency: 4
          - platform: Windows
            runner: blacksmith-4vcpu-windows-2025
            concurrency: 2
        platform: [Linux, Windows]
    defaults:
      run:
        shell: bash
    env:
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare prerequisites
        run: |
          git show c0013e2abaf0efc4482258ebb7b13606f23a8df2:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm exec turbo run test --filter=@bb/scripts --filter=@bb/connect-db --filter=@bb/connect --filter=@bb/ai-gateway --output-logs=errors-only --concurrency=${{ matrix.concurrency }}
      - name: Compare complete affected suites
        env:
          SCOPE: ${{ matrix.scope }}
          TASK_CONCURRENCY: ${{ matrix.concurrency }}
        run: |
          mkdir -p measurements
          files="packages/scripts/test/actions-api.test.mjs packages/connect-db/src/testing.ts"
          for file in $files; do
            name=$(basename "$file")
            cp "$file" "$RUNNER_TEMP/after-$name"
            git show c0013e2abaf0efc4482258ebb7b13606f23a8df2:"$file" > "$RUNNER_TEMP/before-$name"
          done
          filters="--filter=@bb/connect-db --filter=@bb/connect --filter=@bb/ai-gateway"
          if [[ "$SCOPE" == combined ]]; then filters="$filters --filter=@bb/scripts"; fi
          for round in 1 2 3; do
            variants="before after"
            if [[ "$round" == 2 ]]; then variants="after before"; fi
            for variant in $variants; do
              for file in $files; do
                cp "$RUNNER_TEMP/$variant-$(basename "$file")" "$file"
              done
              pnpm exec turbo run test $filters --only --force --output-logs=full --summarize --concurrency="$TASK_CONCURRENCY" > "measurements/$round-$variant.log" 2>&1
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-tests-${{ matrix.platform }}-${{ matrix.scope }}
          path: measurements
