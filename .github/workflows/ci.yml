name: CI
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
    defaults:
      run:
        shell: bash
    env:
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare prerequisites
        run: |
          git show c0013e2abaf0efc4482258ebb7b13606f23a8df2:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm exec turbo run test --filter=@bb/scripts --output-logs=errors-only -- test/actions-api.test.mjs
      - name: Compare complete scripts suite
        run: |
          mkdir -p measurements
          file=packages/scripts/test/actions-api.test.mjs
          cp "$file" "$RUNNER_TEMP/api-after.mjs"
          git show c0013e2abaf0efc4482258ebb7b13606f23a8df2:"$file" > "$RUNNER_TEMP/api-before.mjs"
          for round in 1 2 3; do
            variants="before after"
            if [[ "$round" == 2 ]]; then variants="after before"; fi
            for variant in $variants; do
              cp "$RUNNER_TEMP/api-$variant.mjs" "$file"
              pnpm exec turbo run test --filter=@bb/scripts --only --force --output-logs=full --summarize > "measurements/$round-$variant.log" 2>&1
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-recovery-${{ runner.os }}
          path: measurements
