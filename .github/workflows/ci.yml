name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    name: Compiler cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare build prerequisites
        run: pnpm exec turbo run build --filter=@bb/app --output-logs=new-only > compiler-prepare.log 2>&1
      - name: Save compiler cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/bb-cache/react-compiler
          key: compiler-benchmark-${{ github.run_id }}-${{ runner.os }}
      - name: Clear compiler cache
        run: node -e "require('node:fs').rmSync('.git/bb-cache/react-compiler', {recursive:true, force:true})"
      - name: Build cold 1
        run: node scripts/ci-bench/compiler-cache.mjs cold-1
      - name: Clear compiler cache
        run: node -e "require('node:fs').rmSync('.git/bb-cache/react-compiler', {recursive:true, force:true})"
      - name: Restore compiler cache 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/bb-cache/react-compiler
          key: compiler-benchmark-${{ github.run_id }}-${{ runner.os }}
          fail-on-cache-miss: true
      - name: Build warm 1
        run: node scripts/ci-bench/compiler-cache.mjs warm-1
      - name: Clear compiler cache
        run: node -e "require('node:fs').rmSync('.git/bb-cache/react-compiler', {recursive:true, force:true})"
      - name: Restore compiler cache 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/bb-cache/react-compiler
          key: compiler-benchmark-${{ github.run_id }}-${{ runner.os }}
          fail-on-cache-miss: true
      - name: Build warm 2
        run: node scripts/ci-bench/compiler-cache.mjs warm-2
      - name: Clear compiler cache
        run: node -e "require('node:fs').rmSync('.git/bb-cache/react-compiler', {recursive:true, force:true})"
      - name: Build cold 2
        run: node scripts/ci-bench/compiler-cache.mjs cold-2
      - name: Clear compiler cache
        run: node -e "require('node:fs').rmSync('.git/bb-cache/react-compiler', {recursive:true, force:true})"
      - name: Build cold 3
        run: node scripts/ci-bench/compiler-cache.mjs cold-3
      - name: Clear compiler cache
        run: node -e "require('node:fs').rmSync('.git/bb-cache/react-compiler', {recursive:true, force:true})"
      - name: Restore compiler cache 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/bb-cache/react-compiler
          key: compiler-benchmark-${{ github.run_id }}-${{ runner.os }}
          fail-on-cache-miss: true
      - name: Build warm 3
        run: node scripts/ci-bench/compiler-cache.mjs warm-3
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-measurements-${{ runner.os }}
          path: compiler-*
