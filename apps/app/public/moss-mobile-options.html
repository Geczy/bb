<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moss mobile interaction options</title><style>
:root{--canvas:#fff;--ink:#343434;--surface:color-mix(in oklab,var(--ink) 2.5%,var(--canvas));--muted:color-mix(in oklab,var(--ink) 65%,var(--canvas));--line:color-mix(in oklab,var(--ink) 14%,var(--canvas));--blue:#3477b8}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100dvh;overflow:hidden}.dark{--canvas:#222;--ink:#ddd;--blue:#8abdf1}button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.top{height:48px;background:var(--surface);display:flex;align-items:center;gap:4px;padding:0 8px}.icon{width:44px;height:44px;display:grid;place-items:center;flex-shrink:0;color:var(--muted);border-radius:8px}.tab{height:36px;display:flex;align-items:center;gap:8px;background:color-mix(in oklab,var(--ink) 9%,var(--canvas));padding:0 12px;border-radius:7px;min-width:0;flex:1}.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tab svg{width:14px;height:14px}.toolbar{height:48px;display:flex;align-items:center;gap:6px;background:var(--surface);padding:0 8px}.path{color:var(--blue);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar .icon{width:36px;height:36px}.article{padding:26px 16px 100px;color:color-mix(in oklab,var(--ink) 88%,var(--canvas));font-size:16px;line-height:1.5}.article h1{font-size:28px;letter-spacing:-.7px;line-height:1.2;margin:8px 0 34px}.article h2{font-size:23px;line-height:1.3;margin:20px 0 10px}.article h3{font-size:19px;margin:18px 0 10px}.article p{margin:0 0 12px}.article blockquote{border-left:2px solid var(--line);padding-left:16px;margin:8px 0 18px;font-style:italic}.article ul{padding-left:24px}.article li{padding-bottom:6px}.reveal{position:absolute;right:12px;top:58px;height:44px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 6px #0001;font-size:13px}.reveal+main{padding-top:62px}.sheet{position:fixed;bottom:40px;left:0;right:0;background:var(--canvas);box-shadow:0 -8px 24px #0002;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 16px 16px}.handle{width:32px;height:4px;border-radius:3px;margin:0 auto 10px;background:var(--line)}.sheet-head{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:8px}.sheet button.action{display:flex;width:100%;height:48px;align-items:center;gap:12px;padding:0 10px;border-radius:7px}.sheet button.action:active{background:var(--surface)}.sheet button.action svg{color:var(--muted)}.concept{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);height:40px;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:.04em;color:var(--muted)}
</style><body><script>
const icons={file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10v.01"/>',panel:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M15 3v18m3-14v.01m0 3v.01"/>',send:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.38 8.38 0 0 1 3.8-.9h.5A8.5 8.5 0 0 1 21 11v.5z"/><path d="M12 7v8m-4-4h8"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',open:'<path d="M15 3h6v6m0-6-9 9M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>',chevron:'<path d="m6 9 6 6 6-6"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v1H7l-4 11V7z"/><path d="M3 20h16l3-11H7z"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
const btn=(n,label)=>`<button class="icon" aria-label="${label}">${icon(n)}</button>`;
const option=new URLSearchParams(location.search).get('option')||'sheet';
if(new URLSearchParams(location.search).get('theme')==='dark')document.body.classList.add('dark');
const toolbar=`<div class="toolbar">${icon('file')}<button class="path" aria-label="Copy note path">Reading notes.md</button><button style="height:36px;display:flex;align-items:center;gap:6px;padding:0 8px" aria-label="Send to agent">${icon('send')}Send</button>${btn('more','Note actions')}${option==='reveal'?btn('chevron','Hide note tools'):''}</div>`;
document.body.innerHTML=`<header class="top">${btn('info','Thread info')}<div class="tab">${icon('close')}<span>Reading notes.md</span></div>${option==='sheet'?btn('more','Note actions'):''}${btn('panel','Close note panel')}</header>${option==='pinned'?toolbar:''}${option==='reveal'?`<button class="reveal">${icon('chevron')}Note tools</button>`:''}<main class="article"><h1>Reading notes</h1><p>A quiet place to review the next iteration.</p><blockquote><strong>Review focus</strong><br>Keep controls compact and the note easy to read.</blockquote><h2>Plan the next iteration</h2><p>Start with the reader’s next action. Keep the title and note controls in view while leaving room for the work below.</p><ul><li>Align the header rows.</li><li>Keep the floating toolbar readable.</li><li>Choose a touch interaction before building it.</li></ul><h2>Working notes</h2><h3>Observation 1</h3><p>Reading works best when the controls feel calm and predictable.</p></main>${option==='sheet'?`<section class="sheet" aria-label="Note actions"><div class="handle"></div><div class="sheet-head"><span>Reading notes.md</span>${btn('close','Close note actions')}</div>${[['send','Send to agent'],['copy','Copy file path'],['folder','Show in Finder on Mac'],['open','Open in Moss on Mac']].map(([n,l])=>`<button class="action">${icon(n)}${l}</button>`).join('')}</section>`:''}<footer class="concept">${{sheet:'A · ACTIONS SHEET',reveal:'B · TAP TO REVEAL',pinned:'B · ALWAYS VISIBLE'}[option]} — CONCEPT, NOT BUILT</footer>`;
</script></body></html>
